[package]
name = "v2a03-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The 2A03 as a running machine: power-on and the reference's reset recipe, master-clock half-stepping, and the node dump the golden comparison rides on."

[dependencies]
halfphi = { git = "https://github.com/tinymachines/halfphi", tag = "v0.1.6" }
nes-bus = { git = "https://github.com/tinymachines/nes-bus", tag = "v0.1.1" }
v2a03-netlist = { path = "../v2a03-netlist" }
# The 6502 pin contract (MIT, no die data, no engine): the core is presented
# through it, and the cross-chip gate reads recorded traces in its format.
v6502-pins = { git = "https://github.com/tinymachines/6502", package = "v6502-pins", rev = "5f169ab" }

